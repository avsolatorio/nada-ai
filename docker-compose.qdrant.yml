# Dev-only: Qdrant 1.18.x + nada-ai API (vector search via Qdrant, local embeddings).
# Pair with optional extra ``qdrant-client`` in pyproject.toml / Dockerfile ``--extra qdrant``.
#
# Qdrant storage uses a named volume so data persists across restarts. For a host path instead,
# use ``./data/qdrant-storage:/qdrant/storage`` and ensure the container user can write there.
#
# Usage (API + Qdrant):
#   docker compose -f docker-compose.qdrant.yml up -d
#
# Qdrant only (no API):
#   docker compose -f docker-compose.qdrant.yml up -d qdrant-nada
volumes:
  qdrant-nada-data:

services:
  nada-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: nada-ai-api:local
    container_name: nada-ai-api-qdrant-dev
    restart: always
    ports:
      - "8020:8020"
    environment:
      NADA_SEARCH_BACKEND: qdrant
      NADA_EMBEDDING_BACKEND: local
      # Sparse BM25 leg is on by default (``NADA_QDRANT_SPARSE_LEXICAL``). New collections get ``sparse_vectors_config`` automatically.
      # Opt out: NADA_QDRANT_SPARSE_LEXICAL: "false"
      # If you already have a dense-only volume, either recreate the collection + reindex or set sparse to false until you migrate.
      NADA_QDRANT_URL: http://qdrant-nada:6333
      # NADA_EMBEDDING_MODEL_ID: microsoft/harrier-oss-v1-270m
      NADA_QUERY_PROMPT_NAME: web_search_query
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence_transformers
      AI4DATA_DISCOVERY_DATA_PATH: /workspace/data/nada-discovery
      NADA_EMBEDDING_DEVICE: cpu
      # Optional: override Data Compass URL for ai4data discovery (see ai4data MetadataCatalogConfig).
      # AI4DATA_METADATA_CATALOG_URL: https://your-host.example/index.php
      # Optional if thumbnails live elsewhere: AI4DATA_METADATA_CATALOG_THUMBNAIL_URL
      # Optional: authenticate catalog API calls and PDF downloads with an `x-api-key` header.
      # AI4DATA_METADATA_CATALOG_X_API_KEY: ${AI4DATA_METADATA_CATALOG_X_API_KEY}
      # If downloads are hosted on a different subdomain than the catalog (e.g. training.ihsn.org),
      # allow-list the extra hosts that may receive the key:
      # AI4DATA_METADATA_CATALOG_X_API_KEY_HOSTS: training.ihsn.org,files.ihsn.org
      NADA_QUERY_PROMPT: "Instruct: Retrieve semantically similar text that helps answer the user's query or find related information\nQuery: "
      # NADA_ADMIN_API_KEY: ${NADA_ADMIN_API_KEY}
    volumes:
      - ${HOME}/.cache/huggingface:/models/huggingface
      - ${HOME}/.cache/torch/sentence_transformers:/models/sentence_transformers
      - ./data/nada-discovery:/workspace/data/nada-discovery
    env_file:
      - .env
    depends_on:
      - qdrant-nada

  qdrant-nada:
    image: qdrant/qdrant:v1.18.0
    container_name: nada-ai-qdrant-dev
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-nada-data:/qdrant/storage
    env_file:
      - .env
