name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install and test
        run: |
          uv sync --all-groups
          uv run pytest tests --cov=nada_ai --cov-report=term-missing -q
